version: '3.8'

services:
  jekyll:
    build: .
    ports:
      - "4001:4000"
      - "35730:35729"  # LiveReload port
    volumes:
      - .:/srv/jekyll:cached
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
    command: bundle exec jekyll serve --host 0.0.0.0 --livereload --incremental --force_polling
    
  # Alternative service for one-time builds
  build:
    build: .
    volumes:
      - .:/srv/jekyll:cached
      - bundle_cache:/usr/local/bundle
    command: bundle exec jekyll build
    profiles:
      - build

volumes:
  bundle_cache:
